<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Textos do site — Echo Arena Admin</title>
  <link rel="stylesheet" href="./css/admin.css?v=20260821-admin-experience-1">
  <link rel="stylesheet" href="./css/admin-shell.css?v=20260822-admin-nav-1">
  <link rel="stylesheet" href="./css/admin-polish.css?v=20260821-admin-polish-1">
  <style>
    .settings-page{display:grid;gap:18px}.settings-toolbar{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:5;padding:12px 0;background:var(--admin-bg,#0b1221)}.settings-toolbar-copy strong{display:block;font-size:18px}.settings-toolbar-copy span{display:block;margin-top:5px;color:var(--admin-muted);font-size:12px}.settings-toolbar-actions{display:flex;gap:10px;flex-wrap:wrap}.settings-message{min-height:22px;color:var(--admin-muted);font-size:13px}.settings-message.error{color:#ff8585}.settings-message.ok{color:#4ade80}.settings-card{padding:20px;border:1px solid var(--admin-line);border-radius:14px;background:var(--admin-panel)}.settings-card-head{margin-bottom:16px}.settings-card-head h2{margin:0;font-size:18px}.settings-card-head p{margin:6px 0 0;color:var(--admin-muted);font-size:11.5px;line-height:1.55}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.settings-field{display:grid;gap:7px;min-width:0}.settings-field.full{grid-column:1/-1}.settings-field label{color:#c8cfdd;font-size:11.5px;font-weight:700}.settings-field .help{color:var(--admin-muted);font-size:10px;line-height:1.45}.settings-field .counter{color:var(--admin-muted);font-size:10px;text-align:right}.settings-toggles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.settings-toggle{display:flex;align-items:center;gap:11px;min-width:0;padding:12px 14px;border:1px solid var(--admin-line);border-radius:11px;background:#09111f;cursor:pointer;transition:border-color .15s ease}.settings-toggle:hover{border-color:var(--admin-line2,#31245c)}.settings-toggle input{flex:0 0 auto;width:18px;height:18px;margin:0;accent-color:#8b5cf6;cursor:pointer}.settings-toggle-copy{min-width:0}.settings-toggle-copy strong{display:block;font-size:12px}.settings-toggle-copy span{display:block;margin-top:3px;color:var(--admin-muted);font-size:10px;line-height:1.45}.settings-toggle.is-critical{border-color:#71303b;background:#1b0f16}.settings-toggle.is-critical strong{color:#ff9aaa}.settings-loading{padding:36px;border:1px dashed var(--admin-line);border-radius:14px;background:var(--admin-panel);color:var(--admin-muted);text-align:center;font-size:12px}@media(max-width:860px){.settings-grid,.settings-toggles{grid-template-columns:1fr}}
  </style>
  <link rel="stylesheet" href="../css/echo-theme.css?v=1">
</head>
<body>
  <div data-admin-content>
    <section class="settings-page">
      <header class="settings-toolbar">
        <div class="settings-toolbar-copy"><strong>Textos e configurações do site</strong><span>Identidade, redes sociais e regras de acesso do site público.</span></div>
        <div class="settings-toolbar-actions"><button id="reload" class="admin-button" type="button">Descartar</button><button id="save" class="admin-button primary" type="button">Salvar alterações</button></div>
      </header>
      <div id="message" class="settings-message" role="status" aria-live="polite"></div>
      <div id="settings-body"><div class="settings-loading">Carregando configurações...</div></div>
    </section>
  </div>
  <script type="module">
    import { initAdminShell } from './js/admin-shell.js?v=20260906-home-featured-phase-e-1&sb=20260823-security-supabase-pin-1&sc=20260906-1';
    const shell = await initAdminShell({activeId:'site-texts',pageTitle:'Configurações gerais',pageSubtitle:'Identidade, contatos e regras do site'});
    if (shell) await import('./js/site-texts.js?v=20260822-maintenance-2&sb=20260823-security-supabase-pin-1');
  </script>
</body>
</html>
