<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Testes da migração 2/4/6 — Echo Arena</title>
  <style>
    :root{color-scheme:dark}body{margin:0;background:#050912;color:#e8edf6;font:14px/1.5 Inter,Arial,sans-serif}.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px}.head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap}.head h1{margin:0;font-size:24px}.head p{margin:6px 0 0;color:#91a0b5}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.card,.panel{border:1px solid #223149;border-radius:12px;background:#0a1322}.card{padding:14px}.card small{display:block;color:#8190a6;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.card strong{display:block;margin-top:5px;font-size:25px}.ok strong{color:#4ade80}.bad strong{color:#fb7185}.panel{overflow:hidden}.panel h2{margin:0;padding:14px 16px;border-bottom:1px solid #223149;font-size:14px}.tests{list-style:none;margin:0;padding:0}.tests li{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 16px;border-bottom:1px solid #17263b}.tests li:last-child{border-bottom:0}.badge{min-width:52px;padding:3px 7px;border-radius:999px;font-size:9px;font-weight:900;text-align:center}.badge.pass{color:#86efac;border:1px solid #225d49;background:rgba(22,101,52,.12)}.badge.fail{color:#fecdd3;border:1px solid #7f1d1d;background:rgba(127,29,29,.12)}.test-title{font-weight:800}.test-detail{display:block;margin-top:3px;color:#8795aa;font-size:11px;white-space:pre-wrap}@media(max-width:600px){.summary{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <div><h1>Testes da migração 2/4/6</h1><p>Verifica herança cumulativa, ambiguidades e a separação entre efeitos calculáveis e efeitos reais que aguardam dados oficiais.</p></div>
      <a href="../admin/equipment-audit.html" style="color:#c4b5fd">Voltar à auditoria</a>
    </header>
    <section class="summary"><article class="card"><small>Total</small><strong id="total">—</strong></article><article class="card ok"><small>Aprovados</small><strong id="passed">—</strong></article><article class="card bad"><small>Falhas</small><strong id="failed">—</strong></article></section>
    <section class="panel"><h2>Casos de segurança da migração</h2><ul class="tests" id="results"><li><span class="badge">...</span><div>Executando testes...</div></li></ul></section>
  </main>
  <script type="module" src="./equipment-bonus-migration.test.js?v=2"></script>
</body>
</html>
